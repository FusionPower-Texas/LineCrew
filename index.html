<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2d4d"><meta name="apple-mobile-web-app-capable" content="yes"><title>LineCrew Shared</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--nav:#0b2d4d;--blue:#1677d2;--bg:#f3f6f9;--line:#dce5ec;--good:#16864b;--mut:#6a7a86}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#132534;padding-bottom:78px}header{background:var(--nav);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5}header b{font-size:22px}header small{display:block;opacity:.8}main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:var(--mut);margin:3px 0 5px}input,select,button{width:100%;font:inherit;padding:12px;border:1px solid #cad6df;border-radius:11px;background:#fff}button{background:var(--blue);color:#fff;border:0;font-weight:700}.secondary{background:#eef4f8;color:#24455e}.danger{background:#fff0f0;color:#a22}.good{color:var(--good)}.muted{color:var(--mut);font-size:12px}.page{display:none}.page.active{display:block}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.tabs button{background:#fff;color:#567;border-radius:0;padding:11px 3px;font-size:11px}.tabs button.active{color:var(--blue);font-weight:800}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{padding:10px;border-radius:12px;background:#eef7f2}.metric strong{display:block;font-size:17px;color:var(--good)}.unitrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e7edf1}.unitrow small{display:block;color:var(--mut)}.badge{font-size:10px;text-transform:uppercase;background:#edf3f8;padding:3px 6px;border-radius:8px}.location{font-size:11px;background:#fff7df;padding:3px 6px;border-radius:8px;margin-left:5px}.amt{font-weight:800}.results{border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto;display:none}.result{padding:10px;border-bottom:1px solid #edf1f4}.empty{text-align:center;padding:18px;color:#778}.report{border:1px solid var(--line);border-radius:13px;margin-top:10px;overflow:hidden}.reporthead{padding:12px;display:flex;justify-content:space-between;gap:10px}.detail{display:none;border-top:1px solid var(--line);padding:10px}.detail.open{display:block}.pole{border:1px solid #e4eaee;border-radius:11px;margin:8px 0;padding:9px}.poleh{display:flex;justify-content:space-between}.topbar{display:flex;gap:8px;align-items:center}.pill{font-size:11px;background:#edf3f8;border-radius:999px;padding:5px 8px}.notice{padding:10px;background:#fff7df;border-radius:10px;margin-bottom:10px}.filterbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.filterbar select,.filterbar input{padding:9px;font-size:13px}.polelabel{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.reportactions{display:flex;gap:8px;margin-top:10px}.reportactions button{padding:8px;font-size:12px}.unitactions{display:flex;gap:6px;margin-top:6px}.unitactions button{padding:5px 8px;font-size:11px;width:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.filterbar{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><b>LineCrew</b><small id="who">Shared field test</small></header><main>
<section id="auth" class="page active"><div class="card"><h2>LineCrew Sign In</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="grid" style="margin-top:10px"><button id="signIn">Sign In</button><button class="secondary" id="signUp">Create Account</button></div><p id="authMsg" class="muted"></p></div></section>
<section id="onboard" class="page"><div class="card"><h2>Set Up Your LineCrew Profile</h2><label>Your full name</label><input id="fullName"><label>Setup type</label><select id="setupType"><option value="join">Join existing company</option><option value="create">Create company (Admin)</option></select><div id="joinFields"><label>Company join code</label><input id="joinCode" autocapitalize="characters"><label>Your role</label><select id="joinRole"><option value="foreman">Foreman</option><option value="gf">General Foreman</option></select></div><div id="createFields" class="hidden"><label>Company name</label><input id="companyName" placeholder="Glover Line Construction"></div><button id="finishProfile" style="margin-top:10px">Finish Setup</button><button class="secondary" id="onboardSignOut" style="margin-top:8px">Sign Out</button><p id="onMsg" class="muted"></p></div></section>
<section id="daily" class="page"><div class="card"><h2>Daily Production</h2><div class="grid"><div><label>Foreman</label><input id="foreman" disabled></div><div><label>Crew size</label><input id="crewSize" type="number" value="5"></div><div><label>Hours on this job</label><input id="hours" type="number" step=".5" value="10"></div><div><label>Report Date</label><input id="reportDate" type="date"></div></div><label>Job Number</label><input id="jobSearch" placeholder="Type job number or name" autocomplete="off"><div id="jobResults" class="results"></div><div id="selectedJob" class="notice hidden"></div></div><div class="card"><label>Pole / Location Number</label><input id="location" placeholder="Pole 101"><label>Search unit</label><input id="unitSearch" placeholder="E1-01, VC8, transformer" autocomplete="off"><div id="unitResults" class="results"></div><div id="chosenUnit" class="hidden"><div class="grid"><div><label>Action</label><select id="action"></select></div><div><label>Quantity</label><input id="qty" type="number" step=".01" value="1"></div></div><button id="addUnit" style="margin-top:10px">Add Unit</button></div></div><div class="card"><div class="metrics" style="grid-template-columns:1fr"><div class="metric"><strong id="mh">$0</strong><span class="muted">$/man-hour</span></div></div><div id="entryList" class="empty">No units entered.</div><button id="submitReport">Submit Job Report</button></div></section>
<section id="gf" class="page"><div class="card"><div class="topbar"><h2 id="productionTitle" style="flex:1">GF Dashboard</h2><button class="secondary" id="manageJobs" style="width:auto">Manage Jobs</button><button class="secondary" id="refreshGF" style="width:auto">Refresh</button></div><div id="adminFilters" class="hidden"><div class="filterbar"><select id="filterJob"><option value="">All jobs</option></select><select id="filterForeman"><option value="">All foremen</option></select><input id="filterDate" type="date"></div><button class="secondary" id="clearFilters" style="padding:8px">Clear Filters</button></div><div id="gfReports" class="empty">No submitted reports.</div></div></section>
<section id="jobs" class="page"><div class="card"><div class="topbar"><h2 style="flex:1">Job Management</h2><button class="secondary" id="backGF" style="width:auto">Back to Production</button></div><div id="jobEditor"><div class="grid"><div><label>Job number</label><input id="newJobNo" placeholder="12345"></div><div><label>Job name / location</label><input id="newJobName" placeholder="Athens Rebuild"></div></div><button id="createJob" style="margin-top:10px">Create Active Job</button></div><div id="jobsList" class="empty">No active jobs.</div></div></section>
<section id="admin" class="page"><div class="card"><h2>Company</h2><div id="companyInfo"></div><p id="priceInfo" class="muted"></p></div><div class="card"><h2>Team</h2><p class="muted">All General Foremen can view production from all Foremen in the company.</p><div id="teamList"></div></div><div class="card"><button class="danger" id="signOut">Sign Out</button></div></section>
</main><div id="tabs" class="tabs hidden"><button data-page="daily">Daily</button><button data-page="gf">Production</button><button data-page="jobs">Jobs</button><button data-page="admin">Admin</button><button id="logoutTab">Sign Out</button></div>
<script>
const ADJUSTMENT_FACTOR=0.875;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sb=null,user=null,profile=null,company=null,jobs=[],prices=[],entries=[],pickedUnit=null,pickedJob=null,teamMembers=[],allReports=[];
const SUPABASE_URL='https://ldmyelfuptfuxdfpudgb.supabase.co';
const SUPABASE_KEY='sb_publishable_LReFmJq1WLC9COpKQ5KsbA_Dz4mV8sB';
function localDateISO(){let d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
function setReportDateDefault(){let el=$('reportDate');if(!el)return;let today=localDateISO();el.max=today;if(!el.value)el.value=today}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');$('tabs').classList.toggle('hidden',!['daily','gf','jobs','admin'].includes(id));document.querySelectorAll('.tabs button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}function initClient(){sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});return true}
$('setupType').onchange=()=>{let c=$('setupType').value==='create';$('createFields').classList.toggle('hidden',!c);$('joinFields').classList.toggle('hidden',c)};$('signUp').onclick=async()=>{let {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=error?error.message:'Account created.';if(data?.session){user=data.user;show('onboard')}};$('signIn').onclick=async()=>{let {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authMsg').textContent=error?error.message:'';if(!error){user=data.user;await loadProfile()}};
async function boot(){initClient();let {data:{session}}=await sb.auth.getSession();if(!session){show('auth');return}user=session.user;await loadProfile()}async function loadProfile(){let {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return alert(error.message);if(!data){show('onboard');return}profile=data;let {data:c}=await sb.from('companies').select('*').eq('id',profile.company_id).single();company=c;await enterApp()}
$('finishProfile').onclick=async()=>{let name=$('fullName').value.trim();if(!name)return alert('Enter your name.');let type=$('setupType').value;if(type==='create'){let cname=$('companyName').value.trim();if(!cname)return alert('Enter company name.');let {data:c,error:e}=await sb.from('companies').insert({name:cname,created_by:user.id}).select().single();if(e)return $('onMsg').textContent=e.message;let {error:p}=await sb.from('profiles').insert({id:user.id,company_id:c.id,full_name:name,role:'admin'});if(p)return $('onMsg').textContent=p.message}else{let code=$('joinCode').value.trim().toUpperCase(),role=$('joinRole').value;let {data:c,error:e}=await sb.from('companies').select('*').eq('join_code',code).maybeSingle();if(e||!c)return $('onMsg').textContent=e?.message||'Company code not found.';let {error:p}=await sb.from('profiles').insert({id:user.id,company_id:c.id,full_name:name,role});if(p)return $('onMsg').textContent=p.message}await loadProfile()};
async function enterApp(){$('who').textContent=`${profile.full_name} • ${profile.role.toUpperCase()} • ${company?.name||''}`;$('foreman').value=profile.full_name;setReportDateDefault();await Promise.all([loadJobs(),loadPrices(),loadTeam()]);configureRole();show(profile.role==='foreman'?'daily':profile.role==='gf'?'gf':'admin');if(profile.role!=='foreman')await loadGF()}function configureRole(){let isF=profile.role==='foreman',isGF=profile.role==='gf',isA=profile.role==='admin';document.querySelector('[data-page="daily"]').classList.toggle('hidden',!isF);document.querySelector('[data-page="gf"]').classList.toggle('hidden',!(isGF||isA));document.querySelector('[data-page="jobs"]').classList.toggle('hidden',!(isGF||isA));$('jobEditor').classList.toggle('hidden',!(isGF||isA));$('adminFilters').classList.toggle('hidden',!isA);$('productionTitle').textContent=isA?'Production Dashboard':'GF Dashboard'}
async function loadJobs(){let {data,error}=await sb.from('jobs').select('*').eq('company_id',profile.company_id).eq('active',true).order('job_number');if(error)return console.error(error);jobs=data||[];renderJobs()}function renderJobs(){$('jobsList').className='';$('jobsList').innerHTML=jobs.length?jobs.map(j=>`<div class="unitrow"><div><b>${esc(j.job_number)}</b><small>${esc(j.job_name||'')} • Company-wide</small></div><div style="min-width:90px;text-align:right"><span class="pill">Active</span><button class="danger" style="margin-top:6px;padding:7px" onclick="closeJob('${j.id}')">Close</button></div></div>`).join(''):'<div class="empty">No active jobs.</div>'}$('createJob').onclick=async()=>{let no=$('newJobNo').value.trim(),name=$('newJobName').value.trim();if(!no)return alert('Enter job number.');let {error}=await sb.from('jobs').insert({company_id:profile.company_id,gf_id:null,job_number:no,job_name:name,created_by:user.id});if(error)return alert(error.message);$('newJobNo').value='';$('newJobName').value='';await loadJobs()};window.closeJob=async id=>{if(!confirm('Close this job? It will no longer appear in foreman job search.'))return;let {error}=await sb.from('jobs').update({active:false}).eq('id',id);if(error)return alert(error.message);await loadJobs()};$('manageJobs').onclick=async()=>{show('jobs');await loadJobs()};$('backGF').onclick=async()=>{show('gf');await loadGF()};
$('jobSearch').oninput=e=>{let q=e.target.value.toLowerCase(),arr=jobs.filter(j=>(j.job_number+' '+(j.job_name||'')).toLowerCase().includes(q)).slice(0,20),box=$('jobResults');box.innerHTML=arr.map(j=>`<div class="result" data-id="${j.id}"><b>${esc(j.job_number)}</b><div class="muted">${esc(j.job_name||'')}</div></div>`).join('')||'<div class="empty">No matching active jobs.</div>';box.style.display=q?'block':'none';box.querySelectorAll('.result[data-id]').forEach(el=>el.onclick=()=>pickJob(el.dataset.id))};function pickJob(id){pickedJob=jobs.find(j=>j.id===id);$('jobSearch').value=pickedJob.job_number;$('jobResults').style.display='none';$('selectedJob').classList.remove('hidden');$('selectedJob').innerHTML=`<b>Job ${esc(pickedJob.job_number)}</b><div class="muted">${esc(pickedJob.job_name||'')}</div>`}
async function loadPrices(){let {data,error}=await sb.from('unit_prices').select('*').eq('company_id',profile.company_id).eq('active',true).order('unit');if(error)return console.error(error);prices=data||[];$('priceInfo').textContent=`${prices.length} active unit prices loaded.`}$('unitSearch').oninput=e=>{let q=e.target.value.toLowerCase(),arr=prices.filter(u=>u.unit.toLowerCase().includes(q)).slice(0,30),box=$('unitResults');box.innerHTML=arr.map(u=>`<div class="result" data-id="${u.id}"><b>${esc(u.unit)}</b><div class="muted">${['install','remove','transfer'].filter(a=>u[a]!=null).map(a=>a[0].toUpperCase()+a.slice(1)).join(' • ')}</div></div>`).join('')||'<div class="empty">No matching units.</div>';box.style.display=q?'block':'none';box.querySelectorAll('.result[data-id]').forEach(el=>el.onclick=()=>pickUnit(el.dataset.id))};function pickUnit(id){pickedUnit=prices.find(u=>u.id===id);$('unitSearch').value=pickedUnit.unit;$('unitResults').style.display='none';let acts=['install','remove','transfer'].filter(a=>pickedUnit[a]!=null);$('action').innerHTML=acts.map(a=>`<option value="${a}">${a[0].toUpperCase()+a.slice(1)}</option>`).join('');$('chosenUnit').classList.remove('hidden')}
$('addUnit').onclick=()=>{let loc=$('location').value.trim(),qty=Number($('qty').value);if(!pickedJob)return alert('Select a Job Number first.');if(!loc)return alert('Enter Pole / Location.');if(!pickedUnit||qty<=0)return;let a=$('action').value,rate=Number(pickedUnit[a]);entries.push({pole_location:loc,unit:pickedUnit.unit,action:a,quantity:qty,rate,amount:qty*rate});pickedUnit=null;$('unitSearch').value='';$('chosenUnit').classList.add('hidden');$('qty').value='1';renderEntries()};function totals(){let original=entries.reduce((s,e)=>s+e.amount,0),adjusted=original*ADJUSTMENT_FACTOR,size=Number($('crewSize').value)||0,h=Number($('hours').value)||0;return{original,adjusted,size,h,mh:size*h?adjusted/(size*h):0,ch:h?adjusted/h:0}}function renderEntries(){let t=totals();$('mh').textContent=money(t.mh);$('entryList').className='';$('entryList').innerHTML=entries.length?entries.map((e,i)=>`<div class="unitrow"><div><b>${esc(e.unit)} <span class="badge">${e.action}</span><span class="location">${esc(e.pole_location)}</span></b><small>Quantity: ${e.quantity}</small></div><div><button class="danger" style="padding:5px 8px;margin-top:4px" onclick="removeEntry(${i})">Remove</button></div></div>`).join(''):'<div class="empty">No units entered.</div>'}window.removeEntry=i=>{entries.splice(i,1);renderEntries()};$('crewSize').oninput=renderEntries;$('hours').oninput=renderEntries;
$('submitReport').onclick=async()=>{if(!pickedJob)return alert('Select a Job Number.');if(!entries.length)return alert('Add at least one unit.');let reportDate=$('reportDate').value,today=localDateISO();if(!reportDate)return alert('Select a Report Date.');if(reportDate>today)return alert('Report Date cannot be in the future.');let t=totals(),report={company_id:profile.company_id,job_id:pickedJob.id,foreman_id:profile.id,gf_id:null,crew_name:'',report_date:reportDate,crew_size:t.size,hours:t.h,unit_revenue:t.original,manhour_revenue:t.mh,crewhour_revenue:t.ch,status:'submitted'};let {data:r,error}=await sb.from('daily_reports').insert(report).select().single();if(error)return alert(error.message);let rows=entries.map(e=>({...e,report_id:r.id,company_id:profile.company_id}));let {error:ue}=await sb.from('report_units').insert(rows);if(ue)return alert(ue.message);alert(`Submitted ${pickedJob.job_number}`);entries=[];pickedJob=null;$('jobSearch').value='';$('selectedJob').classList.add('hidden');$('reportDate').value=localDateISO();renderEntries()};
async function loadGF(){if(profile.role==='foreman')return;let q=sb.from('daily_reports').select('*,jobs(job_number,job_name),profiles!daily_reports_foreman_id_fkey(full_name),report_units(*)').eq('company_id',profile.company_id).eq('status','submitted').order('created_at',{ascending:false}).limit(200);let {data,error}=await q;if(error){$('gfReports').textContent=error.message;return}allReports=data||[];buildFilters();applyReportFilters()}function buildFilters(){if(profile.role!=='admin')return;let cur={j:$('filterJob').value,f:$('filterForeman').value},uniq=(a,k)=>[...new Map(a.map(x=>[x[k],x])).values()],js=uniq(allReports.filter(r=>r.job_id),'job_id'),fs=uniq(allReports.filter(r=>r.foreman_id),'foreman_id');$('filterJob').innerHTML='<option value="">All jobs</option>'+js.map(r=>`<option value="${r.job_id}">${esc(r.jobs?.job_number||'')}</option>`).join('');$('filterForeman').innerHTML='<option value="">All foremen</option>'+fs.map(r=>`<option value="${r.foreman_id}">${esc(r.profiles?.full_name||'Foreman')}</option>`).join('');$('filterJob').value=cur.j;$('filterForeman').value=cur.f}function applyReportFilters(){let rs=allReports;if(profile.role==='admin'){let j=$('filterJob').value,f=$('filterForeman').value,d=$('filterDate').value;if(j)rs=rs.filter(r=>r.job_id===j);if(f)rs=rs.filter(r=>r.foreman_id===f);if(d)rs=rs.filter(r=>r.report_date===d)}renderGF(rs)}['filterJob','filterForeman','filterDate'].forEach(id=>$(id).onchange=applyReportFilters);$('clearFilters').onclick=()=>{$('filterJob').value='';$('filterForeman').value='';$('filterDate').value='';applyReportFilters()};
function renderGF(rs){$('gfReports').className='';$('gfReports').innerHTML=rs.length?rs.map(r=>{let original=Number(r.unit_revenue)||0,adjusted=original*ADJUSTMENT_FACTOR,manHours=(Number(r.crew_size)||0)*(Number(r.hours)||0),originalMH=manHours?original/manHours:0,adjustedMH=manHours?adjusted/manHours:0;return`<div class="report"><div class="reporthead" onclick="toggleDetail('${r.id}')"><div><b>${esc(r.profiles?.full_name||'Foreman')}</b><small>Job ${esc(r.jobs?.job_number||'')} • ${r.report_date}</small></div><div style="text-align:right"><div><span class="muted">Original </span><b>${money(original)}</b></div><div><span class="muted">−12.5% </span><b class="good">${money(adjusted)}</b></div><small>${money(originalMH)}/MH original • ${money(adjustedMH)}/MH adjusted ▼</small></div></div><div id="d-${r.id}" class="detail">${gfDetail(r)}</div></div>`}).join(''):'<div class="empty">No submitted reports match the selected filters.</div>'}
window.toggleDetail=id=>$('d-'+id).classList.toggle('open');
function reportById(id){return allReports.find(r=>r.id===id)}
function gfDetail(r){let g={};(r.report_units||[]).forEach(e=>(g[e.pole_location||'Unspecified location']??=[]).push(e));let original=Number(r.unit_revenue)||0,adjusted=original*ADJUSTMENT_FACTOR;let body=Object.entries(g).map(([p,it])=>{let poleOriginal=it.reduce((s,e)=>s+Number(e.amount),0),poleAdjusted=poleOriginal*ADJUSTMENT_FACTOR;return`<div class="pole"><div class="polelabel">Pole / Location</div><div class="poleh"><b>${esc(p)}</b><div style="text-align:right"><b>${money(poleOriginal)}</b><small>Adjusted ${money(poleAdjusted)}</small></div></div>${it.map(e=>{let eo=Number(e.amount)||0,ea=eo*ADJUSTMENT_FACTOR;return`<div class="unitrow"><div><b>${esc(e.unit)} <span class="badge">${e.action}</span></b><small>${e.quantity} × ${money(e.rate)} original</small>${profile.role==='gf'||profile.role==='admin'?`<div class="unitactions"><button class="secondary" onclick="event.stopPropagation();editReportUnit('${r.id}','${e.id}')">Edit Unit</button><button class="danger" onclick="event.stopPropagation();deleteReportUnit('${r.id}','${e.id}')">Delete Unit</button></div>`:''}</div><div style="text-align:right"><div class="amt">${money(eo)}</div><small>Adjusted ${money(ea)}</small></div></div>`}).join('')}</div>`}).join('');body+=`<div class="unitrow"><div><b>Job Report Total</b><small>Original less 12.5%</small></div><div style="text-align:right"><div class="amt">${money(original)}</div><b class="good">${money(adjusted)}</b></div></div>`;if(profile.role==='gf'||profile.role==='admin')body+=`<div class="reportactions"><button class="secondary" onclick="event.stopPropagation();editReport('${r.id}')">Edit Report</button><button class="danger" onclick="event.stopPropagation();deleteReport('${r.id}')">Delete Report</button></div>`;return body}
async function recalcReport(reportId){let {data:units,error}=await sb.from('report_units').select('*').eq('report_id',reportId);if(error)return alert(error.message);let r=reportById(reportId);if(!r)return;let original=(units||[]).reduce((s,e)=>s+Number(e.amount||0),0),size=Number(r.crew_size)||0,h=Number(r.hours)||0,adjusted=original*ADJUSTMENT_FACTOR,mh=size*h?adjusted/(size*h):0,ch=h?adjusted/h:0;let {error:re}=await sb.from('daily_reports').update({unit_revenue:original,manhour_revenue:mh,crewhour_revenue:ch}).eq('id',reportId).eq('company_id',profile.company_id);if(re)return alert(re.message);await loadGF()}
window.editReport=async id=>{let r=reportById(id);if(!r)return;let d=prompt('Report date (YYYY-MM-DD)',r.report_date);if(d===null)return;d=d.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('Use YYYY-MM-DD.');if(d>localDateISO())return alert('Report date cannot be in the future.');let size=prompt('Crew size',r.crew_size);if(size===null)return;size=Number(size);if(!(size>0))return alert('Crew size must be greater than 0.');let h=prompt('Hours on this job',r.hours);if(h===null)return;h=Number(h);if(!(h>0))return alert('Hours must be greater than 0.');let original=(r.report_units||[]).reduce((s,e)=>s+Number(e.amount||0),0),adjusted=original*ADJUSTMENT_FACTOR,mh=size*h?adjusted/(size*h):0,ch=h?adjusted/h:0;let {error}=await sb.from('daily_reports').update({report_date:d,crew_size:size,hours:h,unit_revenue:original,manhour_revenue:mh,crewhour_revenue:ch}).eq('id',id).eq('company_id',profile.company_id);if(error)return alert(error.message);await loadGF()};
window.editReportUnit=async(reportId,unitId)=>{let r=reportById(reportId),e=r?.report_units?.find(x=>x.id===unitId);if(!e)return;let loc=prompt('Pole / Location',e.pole_location||'');if(loc===null)return;loc=loc.trim();if(!loc)return alert('Pole / Location is required.');let unit=prompt('Unit code',e.unit||'');if(unit===null)return;unit=unit.trim();let p=prices.find(x=>x.unit.toLowerCase()===unit.toLowerCase());if(!p)return alert('That unit code is not in the active unit price list.');let action=prompt('Action: install, remove, or transfer',e.action||'');if(action===null)return;action=action.trim().toLowerCase();if(!['install','remove','transfer'].includes(action)||p[action]==null)return alert('That action is not available for this unit.');let qty=prompt('Quantity',e.quantity);if(qty===null)return;qty=Number(qty);if(!(qty>0))return alert('Quantity must be greater than 0.');let rate=Number(p[action]),amount=qty*rate;let {error}=await sb.from('report_units').update({pole_location:loc,unit:p.unit,action,quantity:qty,rate,amount}).eq('id',unitId).eq('company_id',profile.company_id);if(error)return alert(error.message);await recalcReport(reportId)};
window.deleteReportUnit=async(reportId,unitId)=>{let r=reportById(reportId);if((r?.report_units||[]).length<=1)return alert('This is the only unit on the report. Delete the whole report instead.');if(!confirm('Delete this unit from the report?'))return;let {error}=await sb.from('report_units').delete().eq('id',unitId).eq('company_id',profile.company_id);if(error)return alert(error.message);await recalcReport(reportId)};
window.deleteReport=async id=>{let r=reportById(id);if(!r)return;if(!confirm(`Delete ${r.profiles?.full_name||'Foreman'} report for Job ${r.jobs?.job_number||''} on ${r.report_date}? This cannot be undone.`))return;let {error:ue}=await sb.from('report_units').delete().eq('report_id',id).eq('company_id',profile.company_id);if(ue)return alert(ue.message);let {error:re}=await sb.from('daily_reports').delete().eq('id',id).eq('company_id',profile.company_id);if(re)return alert(re.message);await loadGF()};
$('refreshGF').onclick=loadGF;
async function loadTeam(){let {data}=await sb.from('profiles').select('id,full_name,role').eq('company_id',profile.company_id).order('role');teamMembers=data||[];$('teamList').innerHTML=teamMembers.map(p=>`<div class="unitrow"><div><b>${esc(p.full_name)}</b><small>${p.role.toUpperCase()}</small></div></div>`).join('');if(company)$('companyInfo').innerHTML=`<p><b>${esc(company.name)}</b></p><p>Join code: <span class="pill">${esc(company.join_code)}</span></p><p class="muted">Give this code to your GF/Foreman users when they create their LineCrew account.</p>`}$('signOut').onclick=$('logoutTab').onclick=$('onboardSignOut').onclick=async()=>{await sb.auth.signOut();user=null;profile=null;company=null;entries=[];pickedUnit=null;pickedJob=null;$('who').textContent='Shared field test';show('auth')};document.querySelectorAll('.tabs button[data-page]').forEach(b=>b.onclick=async()=>{show(b.dataset.page);if(b.dataset.page==='gf')await loadGF();if(b.dataset.page==='jobs')await loadJobs();if(b.dataset.page==='admin')await loadTeam()});renderEntries();boot();
</script></body></html>
